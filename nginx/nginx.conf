# 从工作区根目录启动：nginx -p <工作区根目录>/ -c nginx/nginx.conf
worker_processes 1;
pid .runtime/nginx/nginx.pid;
error_log .runtime/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log .runtime/nginx/access.log;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_temp_path .runtime/nginx/client_temp;
    proxy_temp_path .runtime/nginx/proxy_temp;
    fastcgi_temp_path .runtime/nginx/fastcgi_temp;
    uwsgi_temp_path .runtime/nginx/uwsgi_temp;
    scgi_temp_path .runtime/nginx/scgi_temp;

    upstream login_backend {
        server 127.0.0.1:8092;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;
        root dist;
        index index.html;

        # 仅检查 Nginx，自身健康不代表后端或数据库可用。
        location = /healthz {
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        # 不添加 /api 前缀、不重写 URI，保持刷新 Cookie 的 Path 匹配。
        location ~ ^/(user|test)(/|$) {
            proxy_pass http://login_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            # Authorization、Cookie 请求头以及 Set-Cookie 响应头默认透传。
            proxy_intercept_errors off;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
